aid: synonym
name: Synonym
description: >-
  Synonym (rebranding to Roebling) is a biomanufacturing infrastructure and
  finance company founded in 2022 by Edward Shenderovich and Joshua Lachter and
  backed by Andreessen Horowitz (a16z). It develops, finances, and builds
  commercial-scale bio-manufacturing facilities to give synthetic biology
  producers flexible fermentation capacity, and it operates bioproduction tools
  including a techno-economic modeling suite (TEA/FEL-1/FEL-2 engines) and the
  Capacitor-powered Match platform that connects clients with production
  capacity. As of this profile Synonym publishes only a marketing website and
  private product surfaces; it exposes no public developer API, OpenAPI,
  documentation portal, or /.well-known discovery surface.
